kind: Deployment
apiVersion: apps/v1
metadata:
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"hello-openshift:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"hello-openshift\")].image"}]'
  name: opademoapp
  labels:
    app.kubernetes.io/app: opademoapp
spec:
  replicas: 1
  selector:
    matchLabels:
      deployment: opademoapp
  template:
    metadata:
      labels:
        deployment: opademoapp
    spec:
      containers:
        - name: hello-openshift
          image: 'openshift/hello-openshift@sha256:aaea76ff622d2f8bcb32e538e7b3cd0ef6d291953f3e7c9f556c1ba5baf47e2e'
          ports:
            - containerPort: 8080
              protocol: TCP
              name: hello-web
            - containerPort: 8888
              protocol: TCP
              name: hello-web2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
apiVersion: v1
kind: Service
metadata:
  name: opademo
spec:
  selector:
    app.kubernetes.io/name: opademoapp
  type: NodePort
  ports:
  - name: http-web-openshift-hello
    nodePort: 30080
    protocol: TCP
    port: 8080
    targetPort: http-web-svc
