apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: andreas-test-project-medium
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

nameSuffix: -medium
labels:
  - pairs:
      security-level: medium

resources:
  - ../../base

patches:
  - target:
      version: v1
      kind: Service
      name: opademo
    path: service-patch.yaml