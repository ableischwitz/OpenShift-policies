apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: andreas-test-project-high
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

nameSuffix: -high
labels:
  - pairs:
      security-level: high

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: opademoapp
      spec:
        template:
          spec:
            containers:
              - name: hello-openshift
                resources:
                  $patch: delete
